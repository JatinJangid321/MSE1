<!DOCTYPE html>
<html>

<head>
    <title>Shopping Bill</title>
</head>

<body>

    <h1>Shopping Bill</h1>

    <table border="1" cellspacing="0" cellpadding="8">

        <thead>
            <tr>
                <th rowspan="2">Item</th>
                <th colspan="2">Price</th>
                <th rowspan="2">Total</th>
            </tr>

            <tr>
                <th>Unit Price</th>
                <th>Quantity</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Apple</td>
                <td>₹100</td>
                <td>2 kg</td>
                <td>₹200</td>
            </tr>

            <tr>
                <td>Rice</td>
                <td>₹60</td>
                <td>5 kg</td>
                <td>₹300</td>
            </tr>

            <tr>
                <td>Milk</td>
                <td>₹60</td>
                <td>2 litre</td>
                <td>₹120</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th colspan="3">Grand Total</th>
                <th>₹620</th>
            </tr>
        </tfoot>

    </table>

</body>

</html>
